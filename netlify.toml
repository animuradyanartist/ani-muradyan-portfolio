# Netlify configuration for animuradyan.com / ani-muradyan-portfolio

[build]
  publish = "_site"
  command = "bash scripts/build.sh"

# The admin API. netlify/functions/api.mjs claims /api/* through its own
# `config.path`, so no redirect is needed here.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cache busting / long-cache for fingerprintable assets (artwork JPEGs)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The gallery-facing portfolio is shared as a direct link, not found in search.
[[headers]]
  for = "/commercial/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The admin is private and never cached, and must never be indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Sensible default security headers for a static portfolio
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
